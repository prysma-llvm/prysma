Node:
  Core:
    Instruction:
      engine: []
      champs:
        children: "llvm::ArrayRef<INode*>"
  Function:
    CallFunction:
      engine: [parser, expression]
      champs:
        name: "Token"
        children: "llvm::ArrayRef<INode*>"
    ArgFunction:
      engine: [parser]
      champs:
        type: "IType*"
        name: "Token"
    DeclarationFunction:
      engine: [parser]
      champs:
        visibility: "Token"
        returnType: "IType*"
        name: "Token"
        arguments: "llvm::ArrayRef<INode*>"
        body: "INode*"
    Return:
      engine: [parser]
      champs:
        returnValue: "INode*"

  Variable:
    AssignmentVariable:
      engine: [parser]
      champs:
        name: "Token"
        expression: "INode*"
        token: "Token"
    DeclarationVariable:
      engine: [parser]
      champs:
        visibility: "Token"
        name: "Token"
        type: "IType*"
        expression: "INode*"  
    RefVariable:
      engine: [parser, expression]
      champs:
        name: "Token"
    UnRefVariable:
      engine: [parser, expression]
      champs:
        name: "Token"
    Identifiant:
      engine: [expression]
      champs: {}

  Array:
    AssignmentArray:
      engine: []
      champs:
        name: "Token"
        expressionIndex: "INode*"
        expression: "INode*"
        token: "Token"
    ArrayInitialization:
      engine: [expression]
      champs:
        elements: "llvm::ArrayRef<INode*>"
    ReadingArray:
      engine: []
      champs:
        indexEquation: "INode*"
        name: "Token"

  Object:
    Class:
      engine: [parser]
      champs: 
        inheritance: "llvm::ArrayRef<INode*>"
        members: "llvm::ArrayRef<INode*>"
        builder: "llvm::ArrayRef<INode*>"
        name: "Token"
    CallObject:
      engine: [parser, expression]
      champs:
        objectName: "Token"
        methodName: "Token"
        children: "llvm::ArrayRef<INode*>"
    AccesAttribute:
      engine: []
      champs:
        objectName: "Token"
        attributeName: "Token"
    DeclarationObject:
      engine: []
      champs:
        objectName: "Token"
        objectType: "IType*"
        
  Condition:
    If:
      engine: [parser]
      champs:
        nodeCondition: "INode*"
        nodeBlocIf: "INode*"
        nodeBlocElse: "INode*"
        nodeBlocEndif: "INode*"
  ControlMemory:
    New:
      engine: [expression]
      champs:
        arguments: "llvm::ArrayRef<INode*>"
        name: "Token"
    Delete:
      engine: [parser]
      champs:
        name: "Token"
        
  IncludeModule:
    Include:
      engine: [parser]
      champs:
        path: "Token"

  Loops:
    While:
      engine: [parser]
      champs:
        nodeCondition: "INode*"
        whileBlock: "INode*"
        whileEndBlock: "INode*"
    
  Math:
    Operation:
      engine: []
      parent: "IExpression"
      champs:
        token: "Token"
        left: "INode*"
        right: "INode*"
    Literal:
      engine: [expression]
      champs:
        token: "Token"

    Negation:
      engine: [expression]
      champs:
        op: "Token"
        operand: "INode*"
    String:
      engine: [expression]
      champs: {}
