name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev cmake g++ make python3 bear

      - name: Configure LLVM
        run: |
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          
      - name: Create virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
    
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        working-directory: tests
        run: python3 run_unit_tests.py

  performance:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ephemeral compiler image
        run: docker build -t prysma-compiler -f docker/server/compiler/Dockerfile .

      - name: Enable Laboratory Mode
        run: |
          docker run --rm --privileged --pid=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            optiplex-lab-mode enable

      - name: Run performance benchmarks (High Fidelity)
        run: docker run --rm --privileged --cpuset-cpus="1-3" -v "${{ github.workspace }}":/workspace prysma-compiler

      - name: Import results and Discord notification
        env:
          PRYSMA_DB_PATH: "$HOME/dashboard-prysma/prysma_perf.db"
          PRYSMA_CONFIG_PATH: "$HOME/dashboard-prysma/dashboard/dashboard_config.json"
        run: python3 tests/save_perf_results.py

      - name: Disable Laboratory Mode
        if: always()
        run: |
          docker run --rm --privileged --pid=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            optiplex-lab-mode disable

      - name: Fix workspace permissions
        if: always()
        run: docker run --rm -v "${{ github.workspace }}":/workspace alpine chown -R $(id -u):$(id -g) /workspace
