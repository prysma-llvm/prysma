name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 clangd-18 cmake g++ make python3 python3-venv bear xvfb libasound2t64 libgbm1 libgtk-3-0

      - name: Configure LLVM
        run: |
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          
      - name: Create virtual environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
    
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt -r tests/environnement_dev_tests/requirements.txt

      - name: Install VS Code test version
        run: |
          mkdir -p "$RUNNER_TEMP/vscode"
          curl --fail --location https://update.code.visualstudio.com/1.96.4/linux-x64/stable -o "$RUNNER_TEMP/vscode.tar.gz"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/vscode" --strip-components=1
          echo "$RUNNER_TEMP/vscode/bin" >> "$GITHUB_PATH"

      - name: Build debug container
        run: docker build --target debug -t prysma-debug -f docker/compiler/Dockerfile .

      - name: Run tests
        working-directory: tests
        run: |
          source ../venv/bin/activate
          xvfb-run -a python3 run_unit_tests.py
        env:
          PRYSMA_BUILD_JOBS: "2"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-development-environment-results
          path: build/dev-env-results

  performance:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy build files to host
        run: |
          cp docker/compiler/Dockerfile $HOME/prysma/Dockerfile
          cp docker/compiler/entrypoint.sh $HOME/prysma/entrypoint.sh

      - name: Build ephemeral compiler image
        run: docker build --target benchmark -t prysma-compiler -f docker/compiler/Dockerfile .

      - name: Enable Laboratory Mode
        run: |
          docker run --rm --privileged --pid=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            optiplex-lab-mode enable

      - name: Run performance benchmarks (High Fidelity)
        run: |
          docker run --rm --cap-add=SYS_ADMIN --cpuset-cpus="1-3" \
            -v "$HOME/prysma":/prysma \
            -v "${{ github.workspace }}":/workspace \
            prysma-compiler "${{ github.event.pull_request.head.ref || github.ref_name }}"

      - name: Import results and Discord notification
        env:
        ## Warning: This is hardcoded; if you want to create your own dashboard, you will need to modify it.
          PRYSMA_DB_PATH: "/home/zyph/dashboard-prysma/prysma_perf.db"
          PRYSMA_CONFIG_PATH: "/home/zyph/dashboard-prysma/dashboard/dashboard_config.json"
        run: python3 tests/save_perf_results.py

      - name: Disable Laboratory Mode
        if: always()
        run: |
          docker run --rm --privileged --pid=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            optiplex-lab-mode disable

      - name: Fix workspace permissions
        if: always()
        run: docker run --rm -v "${{ github.workspace }}":/workspace alpine chown -R $(id -u):$(id -g) /workspace
