name: CI Windows

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r tests/environnement_dev_tests/requirements.txt
      - name: Run native PowerShell tests without WSL
        run: python tests/run_unit_tests.py --dev-env --family window --native-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-results
          path: build/dev-env-results

  # Experimental: Docker Engine inside WSL2, not Docker Desktop.
  # windows-2025 includes WSL2; windows-2022 only enables the legacy WSL1 feature.
  # This job must fail when nested virtualization or WSL preparation is unavailable.
  wsl-docker:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check preinstalled WSL2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:GITHUB_WORKSPACE "build/wsl-results"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Start-Transcript -Path "$destination/wsl-preflight.log"
          try {
            wsl --version
            if ($LASTEXITCODE -ne 0) { throw "Modern WSL is unavailable; this job requires the windows-2025 image with WSL2 preinstalled" }
            $platform = Get-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform
            $platform | Format-List FeatureName, State
            if ($platform.State -ne "Enabled") { throw "VirtualMachinePlatform must be enabled in the runner image before the job starts; enabling it here requires a reboot" }
          } finally {
            Stop-Transcript
          }

      - name: Prepare WSL2
        id: wsl
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = "Stop"
          wsl --set-default-version 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 is unavailable" }
          $archive = Join-Path $env:RUNNER_TEMP "ubuntu-24.04.5.wsl"
          Invoke-WebRequest "https://releases.ubuntu.com/noble/ubuntu-24.04.5-wsl-amd64.wsl" -OutFile $archive
          wsl --import Prysma (Join-Path $env:RUNNER_TEMP "prysma-wsl") $archive --version 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 distribution import failed" }
          wsl -d Prysma -u root -- sh -ec 'uname -r; uname -r | grep -i microsoft-standard-WSL2'
          if ($LASTEXITCODE -ne 0) { throw "WSL2 did not boot successfully" }

      - name: Prepare Docker, VS Code and the Linux test workspace
        id: docker
        shell: pwsh
        timeout-minutes: 15
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = (wsl -d Prysma -- wslpath -a $workspace).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the checkout path in WSL" }
          wsl -d Prysma -u root --cd $root -- bash tests/environnement_dev_tests/window/setup_wsl.sh $root
          if ($LASTEXITCODE -ne 0) { throw "Docker/VS Code preparation failed inside WSL2" }
          wsl -d Prysma -u prysma -- docker info
          if ($LASTEXITCODE -ne 0) { throw "The test user cannot access Docker" }

      - name: Build development image
        id: image
        shell: pwsh
        timeout-minutes: 12
        run: |
          wsl -d Prysma -u prysma --cd /home/prysma/workspace -- docker build --target debug -t prysma-debug -f docker/compiler/Dockerfile .
          if ($LASTEXITCODE -ne 0) { throw "Development image build failed" }

      - name: Run Docker, Bash, clangd and VS Code end-to-end tests inside WSL2
        id: tests
        shell: pwsh
        timeout-minutes: 25
        run: |
          wsl -d Prysma -u prysma --cd /home/prysma/workspace -- env DONT_PROMPT_WSL_INSTALL=1 PRYSMA_VSCODE_BIN=/opt/prysma-vscode/bin/code xvfb-run -a /opt/prysma-tests/bin/python tests/run_unit_tests.py --dev-env --family common --family linux --family vscode --family-timeout 1200
          if ($LASTEXITCODE -ne 0) { throw "Tests failed after successful WSL2/Docker preparation" }

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        with:
          python-version: "3.12"

      - name: Prepare native Windows VS Code and Docker CLI transport
        id: native_setup
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Join-Path $env:RUNNER_TEMP "docker-transport"
          dotnet new console -n docker -o $project
          if ($LASTEXITCODE) { throw "Cannot create Docker transport project" }
          Copy-Item tests/environnement_dev_tests/window/WslDocker.cs "$project/Program.cs" -Force
          dotnet publish $project -o "$project/bin-ci"
          if ($LASTEXITCODE) { throw "Cannot build Docker transport" }
          $transport = (Get-Item -LiteralPath (Join-Path $project "bin-ci")).FullName
          $transport >> $env:GITHUB_PATH
          & (Join-Path $transport "docker.exe") info
          if ($LASTEXITCODE) { throw "Windows cannot reach the Linux Docker engine" }
          $editor = Join-Path $env:RUNNER_TEMP "vscode-windows"
          $archive = Join-Path $env:RUNNER_TEMP "vscode-windows.zip"
          Invoke-WebRequest https://update.code.visualstudio.com/1.96.4/win32-x64-archive/stable -OutFile $archive
          Expand-Archive $archive $editor
          "PRYSMA_VSCODE_BIN=$editor/bin/code.cmd" >> $env:GITHUB_ENV
          python -m pip install -r tests/environnement_dev_tests/requirements.txt

      - name: Check native Windows Docker transport
        id: native_transport
        if: ${{ !cancelled() && steps.native_setup.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedCli = (Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "docker-transport/bin-ci/docker.exe")).FullName
          $psCli = (Get-Command docker.exe -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
          $pythonCli = python -c 'import shutil; print(shutil.which("docker") or "")'
          if ($LASTEXITCODE -ne 0 -or !$pythonCli -or
              [IO.Path]::GetFullPath($pythonCli) -ine $expectedCli -or
              [IO.Path]::GetFullPath($psCli) -ine $expectedCli) {
            throw "Expected WSL Docker transport at $expectedCli; Python resolved '$pythonCli' and PowerShell resolved '$psCli'"
          }
          $wslImage = wsl -d Prysma -u prysma -- docker image inspect prysma-debug --format '{{.Id}}'
          if ($LASTEXITCODE -ne 0 -or !$wslImage) { throw "prysma-debug is missing in WSL" }
          $windowsImage = & $expectedCli image inspect prysma-debug --format '{{.Id}}'
          if ($LASTEXITCODE -ne 0 -or $windowsImage -cne $wslImage) {
            throw "The Windows Docker transport does not see the prysma-debug image built inside WSL"
          }

      - name: Test native Windows PowerShell builds and VS Code breakpoints
        id: native_tests
        if: ${{ !cancelled() && steps.native_transport.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 50
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/run_unit_tests.py --dev-env --family window --family vscode --family-timeout 2700
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: ${{ always() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        with:
          name: windows-vscode-results
          path: build/dev-env-results
          if-no-files-found: error

      - name: Collect WSL reports and diagnostics
        if: always() && steps.wsl.outcome == 'success'
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "build/wsl-results"
          New-Item -ItemType Directory -Force $destination | Out-Null
          wsl -d Prysma -u root -- uname -a 2>&1 | Out-File "$destination/kernel.log"
          wsl -d Prysma -u root -- docker info 2>&1 | Out-File "$destination/docker.log"
          $dest = $destination -replace '\\', '/'
          $target = (wsl -d Prysma -- wslpath -a $dest).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the report destination in WSL" }
          wsl -d Prysma -u root -- sh -c 'if [ -d /home/prysma/workspace/build/dev-env-results ]; then cp -r /home/prysma/workspace/build/dev-env-results "$1/"; fi' sh $target
          if ($LASTEXITCODE -ne 0) { throw "Could not collect WSL test reports" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-docker-results
          path: build/wsl-results
          if-no-files-found: warn

      - name: Stop the dedicated WSL distribution
        if: always() && steps.wsl.outcome == 'success'
        shell: pwsh
        run: wsl --terminate Prysma
